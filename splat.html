<!DOCTYPE html><html lang="en"><head><script src="splat3d.f12b4a03.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>prompt → splats</title><style>:root{color-scheme:dark}html,body{color:#cdd6f4;background:#0b0d12;height:100%;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#wrap{flex-direction:column;justify-content:center;align-items:center;gap:14px;min-height:100%;padding:24px;display:flex}#splat{aspect-ratio:1;image-rendering:pixelated;background:#000;border:1px solid #313244;border-radius:8px;width:min(512px,100vw - 48px);height:auto;box-shadow:0 8px 40px #0009}#controls{grid-template-columns:minmax(0,1fr) auto auto auto auto;align-items:center;gap:8px;width:min(512px,100vw - 48px);display:grid}#prompt{box-sizing:border-box;color:#cdd6f4;font:inherit;background:#181825;border:1px solid #45475a;border-radius:6px;grid-column:1/-1;width:100%;min-width:0;padding:8px 10px;font-size:14px}button{color:#cdd6f4;font:inherit;cursor:pointer;background:#1e2030;border:1px solid #45475a;border-radius:6px;padding:8px 14px;font-size:13px}button:hover{border-color:#89b4fa}button:disabled{opacity:.5;cursor:default}select{color:#cdd6f4;font:inherit;background:#181825;border:1px solid #45475a;border-radius:6px;padding:8px 7px;font-size:13px}#explore-control{white-space:nowrap;color:#a6adc8;font-size:12px}#readout{color:#a6adc8;letter-spacing:.2px;width:min(512px,100vw - 48px);min-height:18px;font-size:13px}#notice{color:#f38ba8;width:min(512px,100vw - 48px);min-height:16px;font-size:13px}a{color:#89b4fa}</style></head><body> <div id="wrap"> <canvas id="splat" width="256" height="256"></canvas> <div id="controls"> <input id="prompt" type="text" placeholder="a photo of a cat" value="a photo of a cat" autocomplete="off"> <select id="representation" aria-label="representation"> <option value="rgb" selected>RGB splats</option> <option value="feature">feature painter</option> <option value="pixels">pixel buffer</option> </select> <label id="explore-control" title="Automatically NUDGE a small number of splats at steps 96 and 260"> <input id="auto-explore" type="checkbox"> auto NUDGE </label> <button id="optimize">Optimize</button> <button id="nudge">NUDGE</button> <button id="reset">Reset</button> </div> <div id="readout">boot…</div> <div id="notice"></div> </div> <script src="splat.59bd6541.js" defer></script> </body></html>
